<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocVerify</title>
    <script src="https://kit.fontawesome.com/189be81f31.js" crossorigin="anonymous"></script>
    <script>
      (function() {
        try {
          const savedPrefs = localStorage.getItem('user_workspace_settings_prefs');
          if (savedPrefs) {
            const { darkMode } = JSON.parse(savedPrefs);
            if (darkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
